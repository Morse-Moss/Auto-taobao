# Minimal offline CI gate for sycm-automation.
#
# Scope (deliberately narrow, matching docs/standards/README.md section 7):
#   - L0 syntax / L1 offline self-tests / L2 unit tests only.
#   - Real browser, Feishu and production PostgreSQL flows are NOT covered here.
#     Integration tests are gated behind external systems by design; the unit
#     suite excludes them (see scripts/run-test-suite.mjs EXCLUSIONS).
#
# Three layers of parallel jobs instead of one, based on measured durations
# (2026-09-11): GitHub's Windows runners are ~3x slower than the dev machine,
# the full skill suite exceeded both a 30-minute and a 60-minute job, and the
# xws-export-market-analysis prepare-flow file alone runs ~17 minutes locally.
# Each skill now runs in its own matrix job; the heaviest skill gets a larger
# budget. fast-gate still covers the runtime layer for quick feedback.
#
# Runner note: windows-latest is used because the project is Windows-native
# (Edge-bound CDP proxy, PowerShell helpers, Windows clipboard contracts).
# Running on Linux would silently skip exactly the behaviour we care about,
# so a green Linux run would be false confidence.

name: offline-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast-gate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Offline self-tests (L1)
        run: npm run test:offline

      - name: Runtime tests (L2)
        run: npm run test:runtime

  skill-tests:
    runs-on: windows-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every skill that owns test files under skills/<name>/{tests,scripts}.
          # Keep this list in sync with what `run-test-suite.mjs skills` discovers:
          # 2026-09-17 audit found three skills missing from this matrix
          # (sycm-alimama-daily-report / xws-faq-operator / xws-sku-collection),
          # i.e. eight test files were running nowhere in CI.
          #
          # The previous comment here claimed the FAQ/question/sku skills "keep
          # their tests in runtime/*.test.mjs, which fast-gate already covers".
          # That is only half true: some FAQ cases do live in runtime/, but those
          # skills also own tests in their own directories, which fast-gate never
          # runs (it only discovers runtime/*.test.mjs, non-recursively).
          #
          # xws-export-market-analysis: prepare-flow.test.mjs alone runs ~17 min
          # on the dev machine (real CLI children with retry backoff), so it
          # gets a budget that survives the ~3x slower GitHub runner.
          # Measured locally 2026-09-17 (dev machine, `--skill=<name>`):
          #   xws-export-market-analysis  ~17 min
          #   sycm-alimama-daily-report   4.3 s   (70 tests)
          #   xws-faq-operator            1.7 s   (16 tests)
          #   xws-sku-collection          1.7 s   (26 tests)
          - skill: xws-export-market-analysis
            timeout: 90
          - skill: huitun-to-feishu-keyword-heat
            timeout: 40
          - skill: sycm-export-search-rank
            timeout: 40
          - skill: sycm-to-feishu-base
            timeout: 40
          - skill: xws-to-feishu-base
            timeout: 40
          - skill: sycm-alimama-daily-report
            timeout: 40
          - skill: xws-faq-operator
            timeout: 40
          - skill: xws-sku-collection
            timeout: 40
    name: skill-tests (${{ matrix.skill }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Python dependencies
        run: |
          py -3 -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Skill unit tests (L2) - ${{ matrix.skill }}
        run: node scripts/run-test-suite.mjs skills --skill=${{ matrix.skill }}

      # NOTE: `npm run test:integration` is intentionally NOT run here.
      # It requires a live CDP proxy / Edge session and a PostgreSQL URL.
      # When those become available in CI, add them as explicit, separately
      # reported jobs - never fold them into this gate.
